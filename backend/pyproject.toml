[project]
name = "stockswing-backend"
version = "0.1.0"
description = "Local-first AI Stock Prediction Engine"
authors = [
    {name = "User", email = "user@example.com"},
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "tensorflow>=2.16.1",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "sqlmodel>=0.0.16",
    "yfinance>=0.2.37",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9"
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true
